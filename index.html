<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Firebase (COMPAT VERSION) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- Optional favicon fix -->
  <link rel="icon" href="data:,">
</head>

<body>

<!-- 🔐 LOGIN SECTION (ALWAYS VISIBLE) -->
<div class="container mt-4">
  <div class="card p-4 mb-4 shadow">
    <h5>🔐 Login</h5>

    <input type="email" id="email" class="form-control mb-2" placeholder="Email">
    <input type="password" id="password" class="form-control mb-2" placeholder="Password">

    <button class="btn btn-primary mb-2" onclick="signup()">Sign Up</button>
    <button class="btn btn-success mb-2" onclick="login()">Login</button>
    <button class="btn btn-danger" onclick="logout()">Logout</button>
  </div>
</div>

<!-- 🧠 TASK APP (HIDDEN INITIALLY) -->
<div id="appSection" style="display:none;">
  <div class="container">

    <!-- 👤 USER EMAIL -->
    <h5 class="mb-3">👤 <span id="userEmail"></span></h5>

    <!-- TASK FORM -->
    <form id="taskForm">
      <div class="row g-3">
        <div class="col-md-4">
          <input type="text" id="title" class="form-control" placeholder="Task Title" required>
        </div>

        <div class="col-md-4">
          <input type="text" id="description" class="form-control" placeholder="Description">
        </div>

        <div class="col-md-3">
          <input type="date" id="deadline" class="form-control" required>
        </div>

        <div class="col-md-1 d-grid">
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </div>
    </form>

    <!-- FILTER BUTTONS -->
    <div class="mb-3 text-center mt-3">
      <button class="btn btn-outline-primary filter-btn" data-filter="all">All</button>
      <button class="btn btn-outline-success filter-btn" data-filter="completed">Completed</button>
      <button class="btn btn-outline-danger filter-btn" data-filter="pending">Pending</button>
    </div>

    <!-- SEARCH -->
    <input type="text" id="searchInput" class="form-control mb-3" placeholder="🔍 Search tasks...">

    <!-- STATS -->
    <div class="row text-center mb-4">
      <div class="col-md-4">
        <div class="card p-3 shadow-sm">
          <h6>Total Tasks</h6>
          <h3 id="totalTasks">0</h3>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-3 shadow-sm">
          <h6>Completed</h6>
          <h3 id="completedTasks">0</h3>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-3 shadow-sm">
          <h6>Pending</h6>
          <h3 id="pendingTasks">0</h3>
        </div>
      </div>
    </div>

    <!-- PROGRESS BAR -->
    <div class="card p-3 mb-4">
      <div class="d-flex justify-content-between">
        <span>Progress</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress mt-2">
        <div id="progressBar" class="progress-bar bg-success" style="width: 0%"></div>
      </div>
    </div>

    <!-- TASK LIST -->
    <div id="taskList" class="row g-3"></div>

  </div>
</div>

<!-- ✏️ EDIT MODAL -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5>Edit Task</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="text" id="editTitle" class="form-control mb-2">
        <input type="text" id="editDesc" class="form-control mb-2">
        <input type="date" id="editDate" class="form-control">
      </div>

      <div class="modal-footer">
        <button class="btn btn-primary" onclick="saveEdit()">Save</button>
      </div>

    </div>
  </div>
</div>

<!-- 🔔 TOAST -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="liveToast" class="toast align-items-center text-white bg-dark border-0">
    <div class="d-flex">
      <div class="toast-body" id="toastMsg"></div>
      <button class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase + App JS -->
<script src="firebase.js"></script>
<script src="script.js"></script>

</body>
</html>
